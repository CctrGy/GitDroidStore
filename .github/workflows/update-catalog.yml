name: Update static application catalog

on:
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-update]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-static-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_catalog.py --owner CctrGy --output catalog.json
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update static application catalog"
          git push
